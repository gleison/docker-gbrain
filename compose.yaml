services:
  postgres:
    container_name: pgvector
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: gbrain
      POSTGRES_PASSWORD: ${GBRAIN_POSTGRES_PASSWORD:?-gbrain}
      POSTGRES_DB: gbrain
    volumes:
      - "~/.postgresql:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - local
  ollama:
    container_name: ollama
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - "~/.ollama:/root/.ollama"
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - local
  gbrain:
    container_name: gbrain
    image: local/gbrain
    restart: unless-stopped
    pre_start:
    - image: ollama/ollama
      command: ["pull", "${OLLAMA_EMBEDDING_MODEL}"]
      environment:
        OLLAMA_HOST: http://ollama:11434
    - image: ollama/ollama
      command: ["pull", "${OLLAMA_CHAT_MODEL}"]
      environment:
        OLLAMA_HOST: http://ollama:11434
    volumes:
      - "~/.gbrain:/root/.gbrain"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434/v1
      GBRAIN_DATABASE_URL: postgresql://gbrain:${GBRAIN_POSTGRES_PASSWORD:-gbrain}@postgres:5432/gbrain
      GBRAIN_EMBEDDING_MODEL: ollama:${OLLAMA_EMBEDDING_MODEL}
      GBRAIN_CHAT_MODEL: ollama:${OLLAMA_CHAT_MODEL}
      GBRAIN_ADMIN_BOOTSTRAP_TOKEN: ${GBRAIN_ADMIN_BOOTSTRAP_TOKEN}
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - local
    ports:
      - "8787:8787"

volumes:
  gbrain-postgres-data:

networks:
  local:
    name: local
    driver: bridge
