x-llama-service: &llama-service
  image: ${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
  restart: unless-stopped
  environment:
    LLAMA_CACHE: /models
  volumes:
    - "~/.llama:/models"
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
    interval: 10s
    timeout: 5s
    retries: 120
    start_period: 10s
  networks:
    - local

services:
  postgres:
    container_name: pgvector
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: gbrain
      POSTGRES_PASSWORD: ${GBRAIN_POSTGRES_PASSWORD:?-gbrain}
      POSTGRES_DB: gbrain
    volumes:
      - "~/.postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - local
  llama-embedding:
    <<: *llama-service
    container_name: llama-embedding
    command:
      - -hf
      - ${LLAMA_EMBEDDING_MODEL}
      - --alias
      - ${LLAMA_EMBEDDING_ALIAS}
      - --embeddings

  llama-chat:
    <<: *llama-service
    container_name: llama-chat
    command:
      - -hf
      - ${LLAMA_CHAT_MODEL}
      - --alias
      - ${LLAMA_CHAT_ALIAS}

  llama-reranker:
    <<: *llama-service
    container_name: llama-reranker
    command:
      - -hf
      - ${LLAMA_RERANKER_MODEL}
      - --alias
      - ${LLAMA_RERANKER_ALIAS}
      - --reranking
      - --pooling
      - rank

  gbrain:
    container_name: gbrain
    image: local/gbrain
    restart: unless-stopped
    volumes:
      - "~/.gbrain:/root/.gbrain"
    environment:
      LLAMA_SERVER_BASE_URL: http://llama-embedding:8080/v1
      LMSTUDIO_BASE_URL: http://llama-chat:8080/v1
      LLAMA_SERVER_RERANKER_BASE_URL: http://llama-reranker:8080/v1
      GBRAIN_DATABASE_URL: postgresql://gbrain:${GBRAIN_POSTGRES_PASSWORD:-gbrain}@postgres:5432/gbrain?sslmode=disable
      GBRAIN_EMBEDDING_MODEL: llama-server:${LLAMA_EMBEDDING_ALIAS}
      GBRAIN_CHAT_MODEL: lmstudio:${LLAMA_CHAT_ALIAS}
      GBRAIN_RERANKER_MODEL: llama-server-reranker:${LLAMA_RERANKER_ALIAS}
      GBRAIN_ADMIN_BOOTSTRAP_TOKEN: ${GBRAIN_ADMIN_BOOTSTRAP_TOKEN}
    depends_on:
      llama-embedding:
        condition: service_healthy
      llama-chat:
        condition: service_healthy
      llama-reranker:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - local
    ports:
      - "8787:8787"

networks:
  local:
    name: local
    driver: bridge
